spring.application.name=backend

# Load secrets from backend/.env (gitignored). File is optional so the app
# still starts in environments where variables are injected directly (CI, prod).
spring.config.import=optional:file:.env[.properties]

# Server
server.port=8080

# Logging
# Override LOG_LEVEL in .env locally (e.g. DEBUG); production should use INFO.
logging.level.com.taskflow=${LOG_LEVEL:INFO}
logging.level.org.springframework.web=WARN
logging.level.org.springframework=WARN
# JDBC SQL logging — set LOG_LEVEL_SQL=DEBUG in .env to see every SQL statement
# and its parameter bindings. Useful for inspecting query counts and spotting
# unintended N+1 patterns. Keep at WARN in CI and production.
logging.level.org.springframework.jdbc.core=${LOG_LEVEL_SQL:WARN}

# Datasource — values come from environment variables (set in .env or injected by CI/prod).
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# HikariCP connection pool — conservative defaults suitable for local dev and small deployments.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# Flyway — migration files are copied from database/migrations/ to classpath:db/migration
# by the maven-resources-plugin during the build (see pom.xml).
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# Redis — cache backing store. CacheConfig falls back to no-op if Redis is unavailable.
# Override host/port in .env or via env injection for non-localhost environments.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Cache TTL is set per-cache in CacheConfig; this is the Spring default TTL (unused directly).
spring.cache.redis.time-to-live=30s

# Kafka — notification event publishing (T13.4)
# Bootstrap server defaults to localhost for local dev; override via env in CI/prod.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:taskflow-notifications}
spring.kafka.consumer.auto-offset-reset=earliest
# Outbox relay polling interval (ms) — lower in tests
taskflow.outbox.relay-interval-ms=${OUTBOX_RELAY_INTERVAL_MS:5000}

# Actuator — health and operational visibility (T14.1)
# Only expose health and info; all other endpoints disabled for external traffic.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ACTUATOR_ADMIN
# Liveness and readiness probes (for Kubernetes / Docker health checks)
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
# Structured log format — logstash-compatible JSON when STRUCTURED_LOGGING=true
logging.structured.format.console=${STRUCTURED_LOGGING:}
# Correlation ID MDC key (populated by CorrelationIdFilter)
logging.pattern.correlation=[%X{correlationId}]

# JWT authentication (see docs/auth-design-adr.md)
# JWT_SECRET is required at startup — no default; set it in .env (local) or via env injection (CI/prod).
# Use a random string of at least 32 characters (256 bits) for HS256.
jwt.secret=${JWT_SECRET}
jwt.access-token-ttl-minutes=${ACCESS_TOKEN_TTL_MINUTES:15}
jwt.refresh-token-ttl-days=${REFRESH_TOKEN_TTL_DAYS:7}
# Set to false in local HTTP development; must be true in production (Secure cookie flag).
cookie.secure=${COOKIE_SECURE:true}

# SpringDoc / Swagger UI
# UI:   http://localhost:8080/swagger-ui.html
# Spec: http://localhost:8080/v3/api-docs  (JSON)
#       http://localhost:8080/v3/api-docs.yaml
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.disable-swagger-default-url=true
