spring.application.name=backend

# Load secrets from backend/.env (gitignored). File is optional so the app
# still starts in environments where variables are injected directly (CI, prod).
spring.config.import=optional:file:.env[.properties]

# Server
server.port=8080

# Logging
# Override LOG_LEVEL in .env locally (e.g. DEBUG); production should use INFO.
logging.level.com.taskflow=${LOG_LEVEL:INFO}
logging.level.org.springframework.web=WARN
logging.level.org.springframework=WARN

# Datasource — values come from environment variables (set in .env or injected by CI/prod).
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# HikariCP connection pool — conservative defaults suitable for local dev and small deployments.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# Flyway — migration files are copied from database/migrations/ to classpath:db/migration
# by the maven-resources-plugin during the build (see pom.xml).
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# Health check — Spring Boot Actuator will be added in a future task.
# management.endpoints.web.exposure.include=health
# management.endpoint.health.show-details=never

# SpringDoc / Swagger UI
# UI:   http://localhost:8080/swagger-ui.html
# Spec: http://localhost:8080/v3/api-docs  (JSON)
#       http://localhost:8080/v3/api-docs.yaml
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.disable-swagger-default-url=true
