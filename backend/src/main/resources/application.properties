spring.application.name=backend

# Server
server.port=8080

# Logging
# Override LOG_LEVEL in .env locally (e.g. DEBUG); production should use INFO.
logging.level.com.example.backend=${LOG_LEVEL:INFO}
logging.level.org.springframework.web=WARN
logging.level.org.springframework=WARN

# Datasource — activated when spring-boot-starter-data-jpa is added (T4.x).
# spring.datasource.url=${SPRING_DATASOURCE_URL}
# spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
# spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Flyway — activated when flyway-core is added (T4.x).
# Migration files are copied from database/migrations/ to classpath:db/migration
# by the maven-resources-plugin during the build (see pom.xml).
# spring.flyway.locations=classpath:db/migration
# spring.flyway.baseline-on-migrate=false

# Health check — Spring Boot Actuator will be added in a future task.
# management.endpoints.web.exposure.include=health
# management.endpoint.health.show-details=never
