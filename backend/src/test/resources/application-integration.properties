# Integration test profile — re-enables DataSource so that tests annotated
# with @ActiveProfiles("integration") run against a real PostgreSQL instance.
#
# This profile overrides the exclusions set in the base test
# application.properties. Flyway is disabled here: integration tests run
# against the schema that is already in place from normal application startup
# (or a prior Flyway run). The integration tests themselves use JUnit 5
# assumptions in @BeforeAll to skip gracefully when PostgreSQL is unavailable.
#
# Hikari initializationFailTimeout=-1 prevents the pool from blocking context
# startup when PostgreSQL is down — the actual connection attempt is deferred
# to @BeforeAll, which calls assumeTrue so tests are skipped, not failed.
spring.autoconfigure.exclude=
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/TaskFlow}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.hikari.initialization-fail-timeout=-1
