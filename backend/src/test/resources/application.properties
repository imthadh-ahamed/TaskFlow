# Unit test configuration — disables database connectivity so context loads
# without a running PostgreSQL instance.
# Integration tests that need the real database should use a separate test
# profile or @SpringBootTest with an explicit datasource configuration.
spring.autoconfigure.exclude=\
  org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
# Kafka — stub bootstrap so auto-configuration resolves; listener auto-start disabled
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.listener.auto-startup=false
taskflow.outbox.relay-interval-ms=999999999

# Stub values for Spring Security beans required by SecurityConfig / JwtService.
# These are never used to mint real tokens; they satisfy the @Value binding only.
jwt.secret=test-secret-value-that-is-long-enough-for-hs256-algorithm-at-least-32-bytes
jwt.access-token-ttl-minutes=15
jwt.refresh-token-ttl-days=7
cookie.secure=false
cors.allowed-origins=http://localhost:3000
