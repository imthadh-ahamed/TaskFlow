name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Prevent a new push from racing a running CI run on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (includes type-check)
        run: npm run build

      - name: Test
        run: npm test

  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    name: Backend build & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and run unit tests
        run: ./mvnw test
        env:
          # Stub values — never real secrets; used by SecurityConfig binding only
          JWT_SECRET: ci-secret-stub-value-that-is-at-least-32-characters-long
          SPRING_DATASOURCE_URL: ""
          SPRING_DATASOURCE_USERNAME: ""
          SPRING_DATASOURCE_PASSWORD: ""

  # ── SQL conventions ─────────────────────────────────────────────────────────
  sql-conventions:
    name: SQL migration conventions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check Flyway naming convention
        # Migrations must match V<n>__<description>.sql (double underscore, no spaces)
        run: |
          set -euo pipefail
          FAILED=0
          for f in database/migrations/V*.sql; do
            basename "$f" | grep -qP '^V\d+__[a-z0-9_]+\.sql$' || {
              echo "FAIL: migration file name does not follow Vn__snake_case.sql: $f"
              FAILED=1
            }
          done
          exit $FAILED

      - name: Check for immutable migration edits
        # Warn (non-blocking) if any tracked migration was modified in this PR
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
                    -- 'database/migrations/V*.sql' || true)
          if [ -n "$CHANGED" ]; then
            echo "WARNING: the following migration files were modified in this PR:"
            echo "$CHANGED"
            echo "Migration files are immutable once applied to a shared environment."
            echo "Add a new migration instead of editing an existing one."
            exit 1
          fi
